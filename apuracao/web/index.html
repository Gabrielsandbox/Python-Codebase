<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
    <script>
      // tema escolhido (localStorage.tema = "light" | "dark"; ausente = automático), antes da 1ª pintura
      (function () {
        try {
          var t = localStorage.getItem('tema');
          if (t !== 'light' && t !== 'dark') return;
          document.documentElement.setAttribute('data-theme', t);
          var cor = t === 'dark' ? '#111113' : '#f6f5f1';
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', cor);
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Apuração em tempo real do 2º turno das eleições presidenciais de 2026, com dados oficiais do TSE, por estado e município." />
    <title>Apuração 2026 — 2º turno</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111113'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23f6f5f1'/%3E%3C/svg%3E" />
  </head>
  <body>
    <a class="skip" href="#mapa">Ir para o mapa</a>
    <div id="app" aria-busy="true">
      <header class="topbar" id="topbar"><div id="alertas" class="alertas-slot"></div></header>
      <main class="page">
        <section class="hero" id="hero" aria-label="Resultado nacional"></section>
        <section class="panel-row" id="caminho" aria-label="Caminho para a vitória"></section>
        <section class="map-section" id="mapa" aria-label="Mapa de resultados"></section>
        <section class="panel-row" id="totais" aria-label="Totais"></section>
        <section class="panel-row" id="linha" aria-label="Evolução da totalização"></section>
        <section class="panel-row" id="tabela" aria-label="Resultados por estado"></section>
      </main>
      <footer class="footer" id="rodape"></footer>
      <aside class="chat" id="chat" aria-label="Chat ao vivo"></aside>
    </div>
    <div id="erro" class="erro" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
