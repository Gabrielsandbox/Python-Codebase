services:
  coletor:
    build: .
    command: ["coletar", "--ano", "2026", "--turno", "2", "--intervalo-rapido", "10", "--intervalo-mun", "60"]
    env_file: [.env]
    volumes: ["./data:/app/data"]
    restart: unless-stopped

  api:
    build: .
    command: ["servir", "--host", "0.0.0.0", "--port", "8000"]
    env_file: [.env]
    volumes: ["./data:/app/data", "./web/public:/app/web/public:ro"]
    ports: ["8000:8000"]
    restart: unless-stopped
